<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap">
<style>html,body{margin:0}body{width:960px;height:288px;position:relative;overflow:hidden;background:var(--bg-card);font-family:var(--font-sans)}svg{position:absolute;inset:0}
.name{position:absolute;left:32px;bottom:56px;margin:0;font:700 96px/.95 var(--font-sans);letter-spacing:-.02em;color:var(--text)}

<body><!--
blocks: brand-700 240x176 (identity blue, with dots), nav/brand-900 192x240 (tall slab), teal-500 128x48 + brand-500 96x48 (satellites); sizes are multiples of space-1 (8px steps).
arrangement: staggered stack right of x=480; tall brand-900 slab bleeds to the right edge area, blue slab top-left of the box, two small blocks beneath it.
pattern: halftone dot field (35 dots, pitch 32, radius 2 to 10 growing toward bottom-right) in teal-100 on the brand-700 block: the flexo screening dots that are the company's signature.
steps/radii: radius-lg (12px) on all blocks; dot pitch 32 = 4 x space-2.
-->

<style>.b700{fill:var(--brand-700)}.b900{fill:var(--nav)}.t500{fill:var(--teal-500)}.b500{fill:var(--brand-500)}.dot{fill:var(--teal-100)}.blk{rx:12px}</style>
<rect class="b700 blk" x="496" y="24" width="240" height="176" rx="12"/>
